name: publish-python

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  publish:
    name: Publish Python verifier
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/allowly-receipt-format
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require tag commit on main
        run: |
          git fetch origin main
          if ! git branch -r --contains "$GITHUB_SHA" | grep -q 'origin/main'; then
            echo "Tagged commit must be reachable from origin/main"
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install verifier
        run: pip install -e verifiers/python
      - name: Run against test vectors
        working-directory: verifiers/python
        run: python test_vectors.py ../../test-vectors.json
      - name: Check typed exception taxonomy
        working-directory: verifiers/python
        run: python test_exception_types.py ../../test-vectors.json
      - name: Check hmac-v1 pseudonym references
        working-directory: verifiers/python
        run: python test_pseudonym_refs.py
      - name: Build package
        working-directory: verifiers/python
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: verifiers/python/dist
