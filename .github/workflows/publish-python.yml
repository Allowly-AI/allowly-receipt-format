name: publish-python

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  publish:
    name: Publish Python verifier
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/allowly-receipt-format
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require tag commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("verifiers/python/pyproject.toml", "rb"))["project"]["version"])')"
          expected_ref="refs/tags/v$package_version"
          if [ "$GITHUB_REF" != "$expected_ref" ]; then
            echo "Publication requires the exact tag $expected_ref"
            exit 1
          fi
      - name: Refuse to overwrite published version
        run: |
          python - <<'PY'
          import tomllib
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote
          from urllib.request import urlopen

          with open("verifiers/python/pyproject.toml", "rb") as file:
              project = tomllib.load(file)["project"]
          name, version = project["name"], project["version"]
          url = f"https://pypi.org/pypi/{quote(name, safe='')}/{quote(version, safe='')}/json"
          try:
              with urlopen(url, timeout=30) as response:
                  status = response.status
          except HTTPError as error:
              if error.code != 404:
                  raise SystemExit(f"Cannot confirm an unpublished version: PyPI returned HTTP {error.code}") from error
              print(f"PyPI confirms {name}@{version} is unpublished (HTTP 404)")
          except (URLError, TimeoutError) as error:
              raise SystemExit("Cannot confirm an unpublished version: PyPI lookup failed") from error
          else:
              raise SystemExit(f"Refusing to publish {name}@{version}: PyPI returned HTTP {status}")
          PY
      - name: Install verifier
        run: pip install -e verifiers/python
      - name: Run against test vectors
        working-directory: verifiers/python
        run: python test_vectors.py ../../test-vectors.json
      - name: Check typed exception taxonomy
        working-directory: verifiers/python
        run: python test_exception_types.py ../../test-vectors.json
      - name: Check hmac-v1 pseudonym references
        working-directory: verifiers/python
        run: python test_pseudonym_refs.py
      - name: Build package
        working-directory: verifiers/python
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: verifiers/python/dist
